<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Dâu Tây</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e11d48">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dâu Tây">
<style>
  :root { --main:#e11d48; --muted:#6b7280; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:#fff; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .app { position:fixed; inset:0; display:flex; flex-direction:column; }
  .views { flex:1; position:relative; min-height:0; }
  .view { position:absolute; inset:0; display:none; }
  .view.active { display:block; }
  iframe { width:100%; height:100%; border:0; background:#fff; position:relative; }
  .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:15px; }
  nav { display:flex; background:#fff; border-top:1px solid #e5e7eb; padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; border:0; background:none; padding:9px 4px 8px; font-size:12px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; }
  nav button .ico { font-size:22px; line-height:1; }
  nav button.active { color:var(--main); font-weight:600; }
</style>
</head>
<body>
<div class="app">
  <div class="views">
    <div class="view active" id="v1"><div class="loading">Đang tải…</div><iframe id="f1" title="App 1" allow="clipboard-write; fullscreen"></iframe></div>
    <div class="view" id="v2"><div class="loading">Đang tải…</div><iframe id="f2" title="App 2" allow="clipboard-write; fullscreen"></iframe></div>
  </div>
  <nav>
    <button class="active" data-t="1"><span class="ico">📊</span>Báo cáo tài chính</button>
    <button data-t="2"><span class="ico">🧾</span>Báo cáo thuế</button>
  </nav>
</div>
<script>
  // ====== ĐỔI LINK / TÊN TAB Ở ĐÂY ======
  const URLS = {
    1: "https://script.google.com/macros/s/AKfycbyVb5C5fd3pYgs8bv3DUqCYY2ukJW9VTfFgSabxVdur5whc8KOesvAtLjhSdMCDmv-g/exec",
    2: "https://script.google.com/macros/s/AKfycbxcolYMtijXXMa26JvM5X-5WqzeysSzlCg9PPo0XJ-yXhFULC9hGR2hVhZd_CS4Xdyn/exec"
  };
  // =======================================
  const loaded = {};
  function show(t) {
    document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "v" + t));
    document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.t === String(t)));
    if (!loaded[t]) { document.getElementById("f" + t).src = URLS[t]; loaded[t] = true; }
    try { localStorage.setItem("lastTab", t); } catch (e) {}
  }
  document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => show(b.dataset.t)));
  let last = "1";
  try { last = localStorage.getItem("lastTab") || "1"; } catch (e) {}
  show(last === "2" ? 2 : 1);
</script>
</body>
</html>
