<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Dâu Tây</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e11d48">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dâu Tây">
<style>
  :root { --main:#e11d48; --muted:#6b7280; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:#fff; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .app { position:fixed; inset:0; display:flex; flex-direction:column; }
  .views { flex:1; position:relative; min-height:0; }
  .view { position:absolute; inset:0; display:none; }
  .view.active { display:block; }
  iframe { width:100%; height:100%; border:0; background:#fff; position:relative; }
  .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:15px; }
  nav { display:flex; background:#fff; border-top:1px solid #e5e7eb; padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; min-width:0; border:0; background:none; padding:9px 2px 8px; font-size:12px; line-height:1.2; text-align:center; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; }
  nav button .ico { font-size:22px; line-height:1; }
  nav button.active { color:var(--main); font-weight:600; }
  nav.hide { display:none; }
  #navShow { display:none; position:fixed; left:50%; bottom:calc(6px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:5;
    border:1px solid #e5e7eb; background:#fffd; color:var(--muted); border-radius:14px; padding:2px 18px; font-size:13px; }
  body.navhid #navShow { display:block; }
  @media(max-width:860px){
    nav button { flex-direction:row; justify-content:center; gap:4px; padding:5px 2px; font-size:11px; }
    nav button .ico { font-size:15px; }
  }
  @media(max-width:520px){
    nav button { flex-direction:column; gap:1px; padding:6px 1px 5px; font-size:10.5px; }
    nav button .ico { font-size:18px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="views" id="views"></div>
  <nav id="nav"></nav>
  <button id="navShow" aria-label="Hiện menu">▲</button>
</div>
<script>
  // ====== ĐỔI LINK / TÊN TAB Ở ĐÂY ======
  const TABS = [
    { icon:"📊", name:"Báo cáo tài chính",
      url:"https://script.google.com/macros/s/AKfycbyVb5C5fd3pYgs8bv3DUqCYY2ukJW9VTfFgSabxVdur5whc8KOesvAtLjhSdMCDmv-g/exec" },
    { icon:"🧾", name:"Báo cáo thuế",
      url:"https://script.google.com/macros/s/AKfycbxcolYMtijXXMa26JvM5X-5WqzeysSzlCg9PPo0XJ-yXhFULC9hGR2hVhZd_CS4Xdyn/exec" },
    { icon:"🔍", name:"Phân tích hồ sơ khai",
      url:"https://script.google.com/macros/s/AKfycbzo_C8Px_0qP-DV1Now0I_4cXkBySOLT5mqONf3TzaQMdmT8d1OSuPjXD8ITTOkYO-8/exec" },
    { icon:"📅", name:"Recheck & Lịch 2026",
      url:"https://script.google.com/macros/s/AKfycbyR7onUiEL7EBXDdhh6qbVV3_TU6TsIvJKlgZ4Ek9UZm2w_E2AQak1Wf60mkTIBcV0Q/exec" }
  ];
  // =======================================

  const viewsEl = document.getElementById("views");
  const nav = document.getElementById("nav");
  const loaded = {};

  TABS.forEach((t, i) => {
    const n = i + 1;
    const v = document.createElement("div");
    v.className = "view"; v.id = "v" + n;
    v.innerHTML = '<div class="loading">Đang tải…</div><iframe id="f' + n + '" title="' + t.name + '" allow="clipboard-write; fullscreen"></iframe>';
    viewsEl.appendChild(v);

    const b = document.createElement("button");
    b.dataset.t = n;
    b.innerHTML = '<span class="ico">' + t.icon + '</span>' + t.name;
    b.addEventListener("click", () => show(n));
    nav.appendChild(b);
  });

  function show(t) {
    document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "v" + t));
    document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.t === String(t)));
    if (!loaded[t]) { document.getElementById("f" + t).src = TABS[t - 1].url; loaded[t] = true; }
    try { localStorage.setItem("lastTab", t); } catch (e) {}
  }

  let last = 1;
  try { last = parseInt(localStorage.getItem("lastTab"), 10) || 1; } catch (e) {}
  if (last < 1 || last > TABS.length) last = 1;
  show(last);

  function setNav(hide) { nav.classList.toggle("hide", hide); document.body.classList.toggle("navhid", hide); }
  document.getElementById("navShow").addEventListener("click", () => setNav(false));
  window.addEventListener("message", e => {
    if (!/(^|\.)(googleusercontent\.com|google\.com)$/.test(new URL(e.origin).hostname)) return;
    if (e.data && e.data.nav === "hide") setNav(true);
    else if (e.data && e.data.nav === "show") setNav(false);
  });
</script>
</body>
</html>
